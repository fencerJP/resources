[package]
name = "resources"
version = "51.0.0-beta"
edition = "2024"
rust-version = "1.93.0"
homepage = "https://apps.gnome.org/app/org.gnome.Resources/"
license = "GPL-3.0-or-later"

[profile.dev]
opt-level = 1

[profile.release]
codegen-units = 1
lto = true
strip = true
opt-level = 3

[dependencies]
adw = { version = "0.9.2", features = ["v1_8"], package = "libadwaita" }
anyhow = { version = "1.0.104", features = ["backtrace"] }
async-channel = "2.5.0"
clap = { version = "4.6.4", features = ["derive"] }
gettext-rs = { version = "0.7.7", features = ["gettext-system"] }
glob = "0.3.4"
gtk = { version = "0.11.4", features = ["v4_12"], package = "gtk4" }
gio-unix = "0.22.8"
lazy-regex = "3.6.1"
libc = { version = "0.2.189", features = ["extra_traits"] }
log = "0.4.33"
neli-wifi = { version = "0.6.1", features = ["default"] }
nix = { version = "0.31.3", default-features = false, features = [
    "signal",
    "sched",
] }
num_cpus = "1.17.0"
nvml-wrapper = "0.12.1"
pastey = "0.2.3"
path-dedot = "4.0.1"
plotters = { version = "0.3.7", default-features = false, features = [
    "area_series",
] }
plotters-cairo = "0.9.0"
pretty_env_logger = "0.5"
process-data = { path = "lib/process_data", features = ["cli"] }
rmp-serde = "1.3.1"
ron = "0.12.2"
rust-ini = "0.21.3"
futures = { version = "0.3.33", default-features = false, features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
soup3 = "0.9.0"
strum = "0.28.0"
strum_macros = "0.28.0"
sysconf = "0.3.4"

[dev-dependencies]
pretty_assertions = "1.4.1"
